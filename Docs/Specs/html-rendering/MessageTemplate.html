<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no: the bubble is not a zoomable document -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Declares both schemes so WebKit never paints a default-white canvas in dark mode -->
<meta name="color-scheme" content="light dark">
<style>
  :root {
    color-scheme: light dark;
    /* BeeChat palette — light. Accent is honey gold; SwiftUI can override via beechat.setAccent(). */
    --bc-accent:       #E8A100;
    --bc-text:         #1C1C1E;   /* ~UIColor.label */
    --bc-text-dim:     rgba(60, 60, 67, 0.62);
    --bc-link:         #946300;   /* accent darkened for AA contrast on light */
    --bc-code-bg:      rgba(28, 28, 30, 0.06);
    --bc-code-border:  rgba(28, 28, 30, 0.12);
    --bc-quote-bar:    var(--bc-accent);
    --bc-table-border: rgba(28, 28, 30, 0.18);
    --bc-hr:           rgba(28, 28, 30, 0.15);
    --bc-img-broken:   rgba(28, 28, 30, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bc-text:         #F2F2F7;
      --bc-text-dim:     rgba(235, 235, 245, 0.60);
      --bc-link:         #FFC83D;
      --bc-code-bg:      rgba(242, 242, 247, 0.10);
      --bc-code-border:  rgba(242, 242, 247, 0.16);
      --bc-table-border: rgba(242, 242, 247, 0.22);
      --bc-hr:           rgba(242, 242, 247, 0.18);
      --bc-img-broken:   rgba(242, 242, 247, 0.10);
    }
  }
  /* Explicit override for a manual in-app theme toggle. Prefer driving this from Swift via
     webView.overrideUserInterfaceStyle (which flips prefers-color-scheme live); this attribute
     is the fallback path via beechat.setTheme('light'|'dark'|''). */
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"]  { color-scheme: dark; }
  html[data-theme="dark"]:root {
    --bc-text:         #F2F2F7;
    --bc-text-dim:     rgba(235, 235, 245, 0.60);
    --bc-link:         #FFC83D;
    --bc-code-bg:      rgba(242, 242, 247, 0.10);
    --bc-code-border:  rgba(242, 242, 247, 0.16);
    --bc-table-border: rgba(242, 242, 247, 0.22);
    --bc-hr:           rgba(242, 242, 247, 0.18);
    --bc-img-broken:   rgba(242, 242, 247, 0.10);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;   /* bubble chrome (fill, 16pt radius, 12pt padding) is SwiftUI's job */
    height: auto;              /* keeps measured height = content height, not viewport height */
  }
  body {
    font: -apple-system-body;  /* Dynamic Type: resolves to the user's Body text style */
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: var(--bc-text);
    line-height: 1.4;
    overflow-wrap: break-word;
    word-break: break-word;    /* long tokens/URLs must never widen the bubble */
    -webkit-text-size-adjust: 100%;
    -webkit-touch-callout: none; /* link previews handled natively */
  }

  #content > :first-child { margin-top: 0; }
  #content > :last-child  { margin-bottom: 0; }

  p { margin: 0 0 0.6em; }
  a { color: var(--bc-link); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  strong, b { font-weight: 600; }

  /* Headings capped for chat context — an <h1> should not shout inside a bubble */
  h1, h2, h3, h4, h5, h6 { margin: 0.7em 0 0.35em; line-height: 1.25; font-weight: 700; }
  h1 { font-size: 1.35em; } h2 { font-size: 1.25em; } h3 { font-size: 1.15em; }
  h4, h5, h6 { font-size: 1.0em; }

  ul, ol { margin: 0.4em 0; padding-left: 1.4em; }
  li { margin: 0.15em 0; }
  li > ul, li > ol { margin: 0.15em 0; }

  blockquote {
    margin: 0.6em 0;
    padding: 2px 0 2px 10px;
    border-left: 3px solid var(--bc-quote-bar);
    color: var(--bc-text-dim);
  }

  code, pre {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.88em;
  }
  code {
    background: var(--bc-code-bg);
    border-radius: 4px;
    padding: 1px 4px;
  }
  pre {
    background: var(--bc-code-bg);
    border: 1px solid var(--bc-code-border);
    border-radius: 8px;
    padding: 8px 10px;
    overflow-x: auto;                    /* long lines scroll inside the block… */
    -webkit-overflow-scrolling: touch;
    white-space: pre;                    /* …instead of widening the bubble */
  }
  pre code { background: none; padding: 0; }

  img {
    max-width: 100%;
    height: auto;                        /* keeps aspect even when width/height attrs disagree */
    display: block;
    border-radius: 8px;
    margin: 0.4em 0;
  }
  img.bc-broken {
    min-width: 44px;
    min-height: 44px;
    background: var(--bc-img-broken);
  }

  /* Wide tables scroll horizontally inside a wrapper injected by JS */
  .bc-scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0.6em 0; }
  table { border-collapse: collapse; font-size: 0.92em; }
  th, td { border: 1px solid var(--bc-table-border); padding: 4px 8px; text-align: left; }
  th { font-weight: 600; }

  hr { border: none; border-top: 1px solid var(--bc-hr); margin: 0.8em 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<!-- dir=auto: per-message RTL/LTR without native involvement -->
<div id="content" dir="auto"></div>

<script>
(() => {
  'use strict';

  const content = document.getElementById('content');

  const bridge = (name, payload) => {
    try { window.webkit.messageHandlers[name].postMessage(payload); } catch (_) { /* not in WKWebView */ }
  };

  // ---- Height reporting ------------------------------------------------
  // Measure #content, not documentElement/body: those can stretch to the current
  // viewport height, which creates a feedback loop once SwiftUI sizes the web
  // view from our own report.
  let lastHeight = -1;
  const reportHeight = () => {
    const h = Math.ceil(content.getBoundingClientRect().height);
    if (h !== lastHeight) {
      lastHeight = h;
      bridge('bcHeight', h);
    }
  };
  new ResizeObserver(reportHeight).observe(content);

  // ---- Content hydration -----------------------------------------------
  const hydrate = () => {
    // Wide tables: wrap in a horizontal scroller so they can't widen the bubble.
    content.querySelectorAll('table').forEach((t) => {
      if (t.parentElement.classList.contains('bc-scroll-x')) return;
      const w = document.createElement('div');
      w.className = 'bc-scroll-x';
      t.replaceWith(w);
      w.appendChild(t);
    });
    // Images: re-report height when they resolve; mark failures.
    content.querySelectorAll('img').forEach((img) => {
      if (img.complete) return;
      img.addEventListener('load', reportHeight, { once: true });
      img.addEventListener('error', () => {
        img.classList.add('bc-broken');
        if (!img.alt) img.alt = 'Image unavailable';
        reportHeight();
      }, { once: true });
    });
    reportHeight();
  };

  // ---- Interaction -----------------------------------------------------
  // All links go to the native side; nothing navigates inside the bubble.
  // (Belt and braces: the Swift WKNavigationDelegate also denies navigation.)
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]');
    if (a) {
      e.preventDefault();
      bridge('bcLink', a.href);
      return;
    }
    const img = e.target.closest('img:not(.bc-broken)');
    if (img && img.src) {
      bridge('bcImage', img.src);   // native full-screen viewer
    }
  });

  // ---- Public API (called from Swift via evaluateJavaScript) ------------
  window.beechat = {
    // html MUST already be sanitized natively (tag/attribute allowlist).
    // innerHTML won't run <script>, but inline handlers like onerror WOULD —
    // never feed this raw message content.
    setContent(html) {
      content.innerHTML = html;
      hydrate();
    },
    // 'light' | 'dark' | '' (empty = follow prefers-color-scheme).
    // Prefer webView.overrideUserInterfaceStyle on the Swift side.
    setTheme(mode) {
      if (mode) document.documentElement.setAttribute('data-theme', mode);
      else document.documentElement.removeAttribute('data-theme');
    },
    setAccent(hex) {
      document.documentElement.style.setProperty('--bc-accent', hex);
    },
  };

  bridge('bcReady', true);   // Swift injects pending content on this signal
})();
</script>
</body>
</html>
